# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: adnyan
      POSTGRES_PASSWORD: adnyan_pass
      POSTGRES_DB: adnyan
    ports:
      - "5432:5432"
    volumes:
      - adnyan_pg:/var/lib/postgresql/data
volumes:
  adnyan_pg:
